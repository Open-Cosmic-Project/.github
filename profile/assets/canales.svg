<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="1200" height="230" role="img" aria-labelledby="t d">
<title id="t">Canales de CosmicOS</title>
<desc id="d">De izquierda a derecha: EventHorizon, Quasar, Pulsar, Nebula y Singularity. Los cambios se promueven en ese orden.</desc>
<style>
.h{opacity:0;animation:pulse 8s ease-out infinite}
@keyframes pulse{0%{opacity:.55}14%{opacity:0}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.h{animation:none}}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
</style>
<rect width="1200" height="230" rx="16" fill="#0e1330"/>
<text x="600" y="38" text-anchor="middle" font-size="17" fill="#8d88c4">Los cambios se promueven de izquierda a derecha</text>
<line x1="120" y1="100" x2="1080" y2="100" stroke="#3a3f7a" stroke-width="3" stroke-dasharray="6 8"/>
<circle class="h" cx="120" cy="100" r="40" fill="#ff5c8a" style="animation-delay:0s"/>
<circle cx="120" cy="100" r="24" fill="#0e1330" stroke="#ff5c8a" stroke-width="4"/>
<circle cx="120" cy="100" r="9" fill="#ff5c8a"/>
<text x="120" y="165" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">EventHorizon</text>
<text x="120" y="192" text-anchor="middle" font-size="17" fill="#a9a3d6">ultraexperimental</text>
<circle class="h" cx="360" cy="100" r="40" fill="#ffb020" style="animation-delay:2s"/>
<circle cx="360" cy="100" r="24" fill="#0e1330" stroke="#ffb020" stroke-width="4"/>
<circle cx="360" cy="100" r="9" fill="#ffb020"/>
<text x="360" y="165" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">Quasar</text>
<text x="360" y="192" text-anchor="middle" font-size="17" fill="#a9a3d6">rolling</text>
<circle class="h" cx="600" cy="100" r="40" fill="#5cc8ff" style="animation-delay:4s"/>
<circle cx="600" cy="100" r="24" fill="#0e1330" stroke="#5cc8ff" stroke-width="4"/>
<circle cx="600" cy="100" r="9" fill="#5cc8ff"/>
<text x="600" y="165" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">Pulsar</text>
<text x="600" y="192" text-anchor="middle" font-size="17" fill="#a9a3d6">beta</text>
<circle class="h" cx="840" cy="100" r="40" fill="#6ee7a0" style="animation-delay:6s"/>
<circle cx="840" cy="100" r="24" fill="#0e1330" stroke="#6ee7a0" stroke-width="4"/>
<circle cx="840" cy="100" r="9" fill="#6ee7a0"/>
<text x="840" y="165" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">Nebula</text>
<text x="840" y="192" text-anchor="middle" font-size="17" fill="#a9a3d6">estable</text>
<circle class="h" cx="1080" cy="100" r="40" fill="#b79bff" style="animation-delay:8s"/>
<circle cx="1080" cy="100" r="24" fill="#0e1330" stroke="#b79bff" stroke-width="4"/>
<circle cx="1080" cy="100" r="9" fill="#b79bff"/>
<text x="1080" y="165" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">Singularity</text>
<text x="1080" y="192" text-anchor="middle" font-size="17" fill="#a9a3d6">LTS</text>
<circle r="7" fill="#fff"><animateMotion dur="8s" repeatCount="indefinite" path="M120,100 L1080,100"/></circle>
</svg>